%YAML 1.1
---
# =============================================================================
# Minimal Suricata configuration for OFFLINE rule validation and PCAP replay.
#   Syntax:  suricata -T -c /config/suricata.yaml -S <rulefile>
#   Replay:  suricata -c /config/suricata.yaml -S <rulefile> -r <pcap> -l /out \
#                     --runmode single -k none
# classification-file / reference-config-file point at paths that exist INSIDE
# the jasonish/suricata base image (/etc/suricata/...).
# =============================================================================

vars:
  address-groups:
    # Wide during validation so rules are not silently scoped out (see EDGE-CASES).
    HOME_NET: "any"
    EXTERNAL_NET: "any"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    DC_SERVERS: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

default-log-dir: /var/log/suricata/

# Stats off keeps -T / replay output focused on rule load + alerts.
stats:
  enabled: no

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: no
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            metadata: yes
            tagged-packets: no
        - http:
            extended: yes

app-layer:
  protocols:
    http:
      enabled: yes
    tls:
      enabled: yes
    dns:
      tcp:
        enabled: yes
      udp:
        enabled: yes

# Built-in profile is plenty for validation; raise on big replays (see EDGE-CASES).
detect:
  profile: medium

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
